<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symulator Silników DC - Dynamiczna Wizualizacja</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #ddd;
            overflow-x: auto;
        }

        .tab {
            padding: 15px 30px;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 30px;
        }

        .control-panel {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .control-panel h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .parameter {
            margin-bottom: 20px;
        }

        .parameter label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider {
            flex: 1;
            height: 6px;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
            background: linear-gradient(to right, #667eea 0%, #764ba2 100%);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .value-input {
            width: 80px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .value-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .solver-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            background: white;
            cursor: pointer;
        }

        .solver-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .calculate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;

            border-radius: 8px;
            font-size: 16px;

            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);

            border: 2px solid #667eea;

            padding: 15px;

            border: 1px solid #e0e0e0;

        @media (max-width: 1200px) {
            .tab-content.active {

            }

            .control-panel {

                top: 0;
            }

            .graphs-grid {

        @media (max-width: 768px) {

            }

        }

    <script>
        // Synchronize sliders with input fields
        function syncSliderInput(sliderId) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(sliderId + '-val');

            slider.addEventListener('input', function() {
                input.value = this.value;
            });

            input.addEventListener('input', function() {
                slider.value = this.value;
            });
        }

        // Initialize all sliders
        const sliders = ['v1', 'p1', 'i01', 'n01', 'ra1', 'rf1', 'sim1',
                        'v2', 'ra2', 'rf2', 'vb2', 'i12', 'n12', 'i22', 'sim2',
                        'v3', 'n13', 'i13', 'tr3', 'rt3', 'sim3'];

        sliders.forEach(id => syncSliderInput(id));

        // Tab switching
        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');

            tabs.forEach((tab, i) => {
                if (i === index) {
                    tab.classList.add('active');
                    contents[i].classList.add('active');
                } else {
                    tab.classList.remove('active');
                    contents[i].classList.remove('active');
                }
            });
        }

        // ODE Solvers
        class ODESolver {
            static rk45(f, y0, t0, tf, n) {
                const h = (tf - t0) / (n - 1);
                const t = [];
                const y = [[]];

                for (let i = 0; i < y0.length; i++) {
                    y[i] = new Array(n);
                    y[i][0] = y0[i];
                }
                t[0] = t0;

                for (let i = 0; i < n - 1; i++) {
                    const yi = y.map(arr => arr[i]);
                    const ti = t[i];

                    const k1 = f(ti, yi);
                    const k2 = f(ti + h/2, yi.map((val, idx) => val + h * k1[idx] / 2));
                    const k3 = f(ti + h/2, yi.map((val, idx) => val + h * k2[idx] / 2));
                    const k4 = f(ti + h, yi.map((val, idx) => val + h * k3[idx]));

                    for (let j = 0; j < y0.length; j++) {
                        y[j][i + 1] = y[j][i] + h * (k1[j] + 2*k2[j] + 2*k3[j] + k4[j]) / 6;
                    }
                    t[i + 1] = t0 + (i + 1) * h;
                }

                return { t, y };
            }

            static euler(f, y0, t0, tf, n) {
                const h = (tf - t0) / (n - 1);
                const t = [];
                const y = [[]];

                for (let i = 0; i < y0.length; i++) {
                    y[i] = new Array(n);
                    y[i][0] = y0[i];
                }
                t[0] = t0;

                for (let i = 0; i < n - 1; i++) {
                    const yi = y.map(arr => arr[i]);
                    const dydt = f(t[i], yi);

                    for (let j = 0; j < y0.length; j++) {
                        y[j][i + 1] = y[j][i] + h * dydt[j];
                    }
                    t[i + 1] = t0 + (i + 1) * h;
                }

                return { t, y };
            }
        }

        // Problem 1: Shunt Motor
        function calculateShuntMotor() {
            try {
                // Get parameters
                const V = parseFloat(document.getElementById('v1-val').value);
                const P_input = parseFloat(document.getElementById('p1-val').value) * 1000;
                const I0 = parseFloat(document.getElementById('i01-val').value);
                const N0 = parseFloat(document.getElementById('n01-val').value);
                const Ra = parseFloat(document.getElementById('ra1-val').value);
                const Rf = parseFloat(document.getElementById('rf1-val').value);
                const simTime = parseFloat(document.getElementById('sim1-val').value);
                const solver = document.getElementById('solver1').value;

                // Calculations
                const If = V / Rf;
                const I = P_input / V;
                const Ia = I - If;
                const Ia0 = I0 - If;
                const Eb0 = V - Ia0 * Ra;
                const Eb = V - Ia * Ra;
                const N = N0 * (Eb / Eb0);
                const omega = 2 * Math.PI * N / 60;
                const T = (Eb * Ia) / omega;

                // Losses and efficiency
                const Cu_loss_arm = Ia * Ia * Ra;
                const Cu_loss_field = If * If * Rf;
                const P_no_load = V * I0;
                const Iron_friction_loss = P_no_load - Ia0 * Ia0 * Ra - If * If * Rf;
                const Total_loss = Cu_loss_arm + Cu_loss_field + Iron_friction_loss;
                const P_output = P_input - Total_loss;
                const efficiency = (P_output / P_input) * 100;

                // Display results
                const resultsDiv = document.getElementById('results1');
                resultsDiv.innerHTML = `
                    <h4>ANALIZA SILNIKA BOCZNIKOWEGO</h4>
                    <hr style="border: 1px solid #667eea; margin: 10px 0;">

                    <strong>Parametry wejściowe:</strong><br>
                    Napięcie: ${V} V<br>
                    Moc wejściowa: ${(P_input/1000).toFixed(2)} kW<br>
                    Prąd wejściowy: ${I.toFixed(2)} A<br>
                    Prąd wzbudzenia: ${If.toFixed(2)} A<br>
                    Prąd twornika: ${Ia.toFixed(2)} A<br>
                    <br>

                    <strong>Obliczone wyniki:</strong><br>
                    <span class="highlight">(a) Moment: ${T.toFixed(2)} N·m</span><br>
                    <span class="highlight">(b) Sprawność: ${efficiency.toFixed(2)} %</span><br>
                    <span class="highlight">(c) Prędkość: ${N.toFixed(2)} rpm</span><br>
                    <br>

                    <strong>Dodatkowe informacje:</strong><br>
                    SEM: ${Eb.toFixed(2)} V<br>
                    Straty twornika: ${Cu_loss_arm.toFixed(2)} W<br>
                    Straty wzbudzenia: ${Cu_loss_field.toFixed(2)} W<br>
                    Straty rdzenia i tarcia: ${Iron_friction_loss.toFixed(2)} W<br>
                    Moc wyjściowa: ${(P_output/1000).toFixed(2)} kW
                `;

                // Dynamic simulation
                const J = 0.05;
                const B = 0.01;
                const Kt = Eb0 / (2 * Math.PI * N0 / 60);

                const dynamics = (t, y) => {
                    const omega = y[0];
                    const Ia = y[1];
                    const If = V / Rf;
                    const Eb = Kt * omega * If;
                    const La = 0.1;
                    const dIa_dt = (V - Eb - Ia * Ra) / La;
                    const T = Kt * If * Ia;
                    const domega_dt = (T - B * omega) / J;
                    return [domega_dt, dIa_dt];
                };

                const y0 = [0, 0];
                const n = 500;

                let sol;
                if (solver === 'rk45') {
                    sol = ODESolver.rk45(dynamics, y0, 0, simTime, n);
                } else {
                    sol = ODESolver.euler(dynamics, y0, 0, simTime, n);
                }

                const t = sol.t;
                const omega_sim = sol.y[0];
                const Ia_sim = sol.y[1];
                const speed_sim = omega_sim.map(w => w * 60 / (2 * Math.PI));
                const torque_sim = Ia_sim.map(ia => Kt * (V / Rf) * ia);
                const power_sim = torque_sim.map((t, i) => t * omega_sim[i] / 1000);

                // Plot graphs
                plotShuntMotorGraphs(t, speed_sim, Ia_sim, torque_sim, power_sim, N, Ia, T, P_output/1000);

            } catch (error) {
                document.getElementById('results1').innerHTML =
                    `<span class="error">Błąd w obliczeniach: ${error.message}</span>`;
            }
        }

        // Problem 2: Series Motor Speed

                const Eb1 = V - I1 * (Ra + Rf) - Vb;
                const Eb2 = V - I2 * (Ra + Rf) - Vb;
                const N2 = N1 * (Eb2 / Eb1) * (I1 / I2);

                const omega1 = 2 * Math.PI * N1 / 60;
                const omega2 = 2 * Math.PI * N2 / 60;
                const T1 = (Eb1 * I1) / omega1;
                const T2 = (Eb2 * I2) / omega2;

                const J = 0.08;
                const B = 0.02;

                const dynamics = (t, y, I_target) => {
                    const omega = y[0];
                    const Ia = y[1];
                    const phi = 0.01 * Ia;
                    const Eb = phi * omega;
                    const L_total = 0.3;

                const omega_combined = [...sol1.y[0], ...sol2.y[0]];
                const Ia_combined = [...sol1.y[1], ...sol2.y[1]];

                const speed_combined = omega_combined.map(w => w * 60 / (2 * Math.PI));

                // Plot graphs

                                          N1, N2, I1, I2, T1, T2, t_half, V, Ra, Rf, Vb, Eb1);

            } catch (error) {
                document.getElementById('results2').innerHTML =
                    `<span class="error">Błąd w obliczeniach: ${error.message}</span>`;
            }
        }

                marker: { color: '#27ae60', size: 12 }
            }, {
                x: [N2],
                y: [T2],
                type: 'scatter',
                mode: 'markers',
                name: `Punkt 2: (${N2.toFixed(1)}rpm, ${T2.toFixed(1)}N·m)`,
                marker: { color: '#e74c3c', size: 12 }
            }], {
                title: 'Charakterystyka Moment-Prędkość',
                xaxis: { title: 'Prędkość (rpm)' },
                yaxis: { title: 'Moment (N·m)' },
                margin: { t: 40, r: 20, b: 40, l: 60 }
            }, { responsive: true });
        }

        // Initialize first calculation on load
        window.addEventListener('load', function() {
            calculateShuntMotor();
        });
    </script>
</body>
</html>
